<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Water Sort Puzzle - Gallon Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <span class="game-badge">Water Sort</span>
                <h1 id="level-title">Level 1</h1>
            </div>
            <div class="header-right">
                <div class="stat-pill timer-pill">
                    <span class="stat-label">Waktu</span>
                    <span id="timer-display" class="stat-value">--:--</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">Moves</span>
                    <span id="move-count" class="stat-value">0</span>
                </div>
                <button id="level-select-btn" class="icon-button" title="Pilih Level">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Game Board (No Scroll, Auto-Fit) -->
        <main class="game-main">
            <div id="gallon-board" class="gallon-board"></div>
        </main>

        <!-- Bottom Controls Dock -->
        <footer class="app-dock">
            <button id="btn-restart" class="dock-button" title="Restart Level">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                <span>Ulangi</span>
            </button>
            <button id="btn-undo" class="dock-button" title="Undo Move">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
                <span>Kembali</span>
            </button>
            <button id="btn-next" class="dock-button primary" title="Next Level" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>Lanjut</span>
            </button>
        </footer>
    </div>

    <!-- Level Selection Modal -->
    <div id="level-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass">
            <h2>Pilih Level (1 - 10)</h2>
            <div id="level-grid" class="level-grid"></div>
            <button id="close-level-modal" class="modal-close-btn">Tutup</button>
        </div>
    </div>

    <!-- Win Modal Overlay -->
    <div id="win-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass win-content">
            <div class="win-icon">🎉</div>
            <h2>Level Selesai!</h2>
            <p id="win-stats">Hebat! Kamu menyelesaikan level ini.</p>
            <button id="btn-next-modal" class="primary-btn">Level Berikutnya</button>
        </div>
    </div>

    <!-- Game Over / Time Out Modal -->
    <div id="gameover-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass win-content">
            <div class="win-icon">⏰</div>
            <h2>Waktu Habis!</h2>
            <p>Waktu kamu habis untuk level ini. Coba lagi!</p>
            <button id="btn-retry-modal" class="primary-btn">Coba Lagi</button>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
